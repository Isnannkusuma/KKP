[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ============================================
; Process 1: PHP Artisan Serve (Laravel)
; ============================================
[program:laravel]
command=php artisan serve --host=0.0.0.0 --port=8000
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/laravel.err.log
stdout_logfile=/var/log/laravel.out.log
user=www-data
environment=HOME="/var/www",USER="www-data",PEGAWAI_DB_HOST="%(ENV_PEGAWAI_DB_HOST)s",PEGAWAI_DB_PORT="%(ENV_PEGAWAI_DB_PORT)s",PEGAWAI_DB_DATABASE="%(ENV_PEGAWAI_DB_DATABASE)s",PEGAWAI_DB_USERNAME="%(ENV_PEGAWAI_DB_USERNAME)s",PEGAWAI_DB_PASSWORD="%(ENV_PEGAWAI_DB_PASSWORD)s"

; ============================================
; Process 2: Laravel Queue Worker
; ============================================
[program:queue]
command=php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/queue.err.log
stdout_logfile=/var/log/queue.out.log
user=www-data
numprocs=1
environment=HOME="/var/www",USER="www-data",PEGAWAI_DB_HOST="%(ENV_PEGAWAI_DB_HOST)s",PEGAWAI_DB_PORT="%(ENV_PEGAWAI_DB_PORT)s",PEGAWAI_DB_DATABASE="%(ENV_PEGAWAI_DB_DATABASE)s",PEGAWAI_DB_USERNAME="%(ENV_PEGAWAI_DB_USERNAME)s",PEGAWAI_DB_PASSWORD="%(ENV_PEGAWAI_DB_PASSWORD)s"

