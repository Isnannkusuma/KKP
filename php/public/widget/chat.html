<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layanan CS AI Biro SDMAO KKP</title>
<style>
    :root {
        --navy: #16283d;
        --navy-light: #1e3a5c;
        --teal: #2f6f6b;
        --teal-dark: #245552;
        --bg-mint: #eef6f4;
        --border: #d9e6e3;
        --text: #16283d;
        --text-muted: #5b7370;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg-mint);
        position: relative;
    }
    header {
        background: var(--navy);
        color: white;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
    }
    header .title {
        min-width: 0;
        overflow: hidden;
        font-weight: 700;
        font-size: 14px;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    header .auth-area { font-size: 12px; display: flex; align-items: center; gap: 8px; }
    header .auth-area button {
        background: var(--teal);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 5px 12px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
    }
    header .auth-area button:hover { background: var(--teal-dark); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    #widget-close {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 50%;
        background: transparent;
        color: white;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
    }
    #widget-close:hover { background: rgba(255,255,255,.12); }
    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .msg {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
    }
    .msg.user {
        align-self: flex-end;
        background: var(--teal);
        color: white;
        border-bottom-right-radius: 4px;
    }
    .msg.bot {
        align-self: flex-start;
        background: white;
        color: var(--text);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
        min-width: 0;
        overflow-wrap: anywhere;
    }
    .msg.bot a {
        display: inline-block;
        margin-top: 2px;
        color: var(--teal);
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
    }
    .msg.bot a:hover { color: var(--teal-dark); }
    .msg.loading {
        align-self: flex-start;
        color: var(--text-muted);
        font-size: 12px;
        font-style: italic;
    }
    form#chat-form {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--border);
        background: white;
        flex-shrink: 0;
    }
    input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 8px 14px;
        font-size: 13px;
        outline: none;
        min-width: 0;
    }
    input:focus { border-color: var(--teal); }
    button[type="submit"] {
        background: var(--teal);
        color: white;
        border: none;
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
    }
    button[type="submit"]:hover { background: var(--teal-dark); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    #chat-mic {
        background: white;
        color: var(--teal);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 8px 10px;
        cursor: pointer;
        flex-shrink: 0;
    }
    #chat-mic svg { display: block; width: 16px; height: 16px; }
    #chat-mic.recording { color: #b42318; border-color: #fda29b; background: #fff5f4; }
    #chat-mic:disabled { opacity: 0.5; cursor: not-allowed; }
    .speech-button {
        display: block;
        margin-top: 8px;
        padding: 4px 8px;
        color: var(--teal);
        background: var(--bg-mint);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 11px;
        cursor: pointer;
    }
    .speech-button:disabled { opacity: 0.6; cursor: wait; }
    .speech-error { display: block; margin-top: 4px; color: #b42318; font-size: 11px; }
    #voice-status {
        min-height: 0;
        padding: 0 12px;
        background: white;
        color: var(--text-muted);
        font-size: 11px;
    }
    #voice-status:not(:empty) { padding-bottom: 8px; }

    /* Login modal */
    #login-overlay {
        position: absolute;
        inset: 0;
        background: rgba(22, 40, 61, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 20px;
    }
    #login-overlay.open { display: flex; }
    #login-box {
        background: white;
        border-radius: 14px;
        padding: 22px;
        width: 100%;
        max-width: 300px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        position: relative;
    }
    #login-close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: #eef2f1;
        color: var(--navy);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #login-close:hover { background: #e2e9e7; }
    #login-box h3 { font-size: 16px; color: var(--navy); font-weight: 700; margin-bottom: 6px; padding-right: 24px; }
    #login-box p { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
    #login-form { display: flex; flex-direction: column; }
    #login-box .field { display: flex; flex-direction: column; width: 100%; margin-bottom: 12px; }
    #login-box label {
        font-size: 12px;
        font-weight: 600;
        color: var(--navy);
        display: block;
        margin-bottom: 5px;
    }
    #login-box input {
        display: block;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
    }
    #login-error {
        color: #c0392b;
        font-size: 12px;
        margin-top: 4px;
        display: none;
    }
    #login-actions {
        display: flex;
        flex-direction: column;
        margin-top: 6px;
    }
    #login-actions button {
        width: 100%;
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        border: none;
        cursor: pointer;
    }
    #login-submit { background: var(--teal); color: white; }
    #login-submit:hover { background: var(--teal-dark); }
    #login-submit:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>
    <header>
        <span class="title">Layanan CS AI Biro SDMAO KKP</span>
        <div class="header-actions">
            <span class="auth-area" id="auth-area">
                <button type="button" id="login-trigger">Login</button>
            </span>
            <button type="button" id="widget-close" aria-label="Tutup widget chat">&times;</button>
        </div>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Tulis pertanyaan..." autocomplete="off" />
        <button type="button" id="chat-mic" aria-label="Kirim pertanyaan dengan suara" title="Kirim pertanyaan dengan suara (maksimal 60 detik)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="2" width="6" height="13" rx="3"></rect>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <path d="M12 19v3"></path>
            </svg>
        </button>
        <button type="submit" id="chat-submit">Kirim</button>
    </form>
    <div id="voice-status" role="status" aria-live="polite"></div>

    <div id="login-overlay">
        <div id="login-box">
            <button type="button" id="login-close" aria-label="Tutup">&times;</button>
            <h3>Login untuk melanjutkan</h3>
            <p>Beberapa pertanyaan (data pribadi, pemetaan, bangkom) memerlukan login dengan NIP.</p>
            <form id="login-form">
                <div class="field">
                    <label for="login-nip">NIP</label>
                    <input type="text" id="login-nip" autocomplete="username" required />
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" autocomplete="current-password" required />
                </div>
                <div id="login-error"></div>
                <div id="login-actions">
                    <button type="submit" id="login-submit">Login</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var widgetKey = params.get('widget_key');
            var identityToken = null; // token SSO dari situs lain (opsional, untuk masa depan)
            var pageOrigin = null;
            var history = [];
            var pendingMessage = null; // pertanyaan yang tertunda menunggu login

            // ---------- Sesi login widget (NIP+password) ----------
            var STORAGE_KEY = 'kkp_chat_widget_session_' + widgetKey;
            var sessionToken = null;
            var currentUser = null; // {name, nip}

            try {
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    var parsed = JSON.parse(saved);
                    sessionToken = parsed.token;
                    currentUser = parsed.user;
                }
            } catch (e) { /* localStorage tidak tersedia, lanjut tanpa sesi tersimpan */ }

            var messagesEl = document.getElementById('messages');
            var formEl = document.getElementById('chat-form');
            var inputEl = document.getElementById('chat-input');
            var submitEl = document.getElementById('chat-submit');
            var micEl = document.getElementById('chat-mic');
            var voiceStatusEl = document.getElementById('voice-status');
            var authAreaEl = document.getElementById('auth-area');
            var loginOverlayEl = document.getElementById('login-overlay');
            var loginFormEl = document.getElementById('login-form');
            var loginNipEl = document.getElementById('login-nip');
            var loginPasswordEl = document.getElementById('login-password');
            var loginErrorEl = document.getElementById('login-error');
            var loginSubmitEl = document.getElementById('login-submit');
            var loginCloseEl = document.getElementById('login-close');
            var recorder = null;
            var recordingStream = null;
            var recordingChunks = [];
            var recordingTimeout = null;
            var voiceBusy = false;
            var microphoneIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"></rect><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>';
            var stopIcon = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>';

            window.addEventListener('message', function (event) {
                if (
                    event.source === window.parent &&
                    event.data &&
                    event.data.type === 'kkp-chat-init'
                ) {
                    pageOrigin = event.origin;
                    identityToken = event.data.identityToken || null;
                }
            });

            document.getElementById('widget-close').addEventListener('click', function () {
                window.parent.postMessage({ type: 'kkp-chat-close' }, pageOrigin || '*');
            });

            function renderAuthArea() {
                if (currentUser) {
                    authAreaEl.innerHTML =
                        '<span>' + escapeHtml(currentUser.name || currentUser.nip) + '</span>' +
                        '<button type="button" id="logout-trigger">Logout</button>';
                    document.getElementById('logout-trigger').addEventListener('click', logout);
                } else {
                    authAreaEl.innerHTML = '<button type="button" id="login-trigger">Login</button>';
                    document.getElementById('login-trigger').addEventListener('click', function () {
                        openLoginModal(null);
                    });
                }
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function saveSession(token, user) {
                sessionToken = token;
                currentUser = user;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ token: token, user: user }));
                } catch (e) { /* abaikan kalau localStorage tidak tersedia */ }
                renderAuthArea();
            }

            function clearSession() {
                sessionToken = null;
                currentUser = null;
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                renderAuthArea();
            }

            function logout() {
                fetch(window.location.origin + '/api/widget/auth/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Widget-Key': widgetKey },
                    body: JSON.stringify({ widget_key: widgetKey, page_origin: pageOrigin }),
                }).catch(function () {});
                clearSession();
                addMessage('bot', 'Anda telah logout.');
            }

            function openLoginModal(messageToRetryAfterLogin) {
                pendingMessage = messageToRetryAfterLogin;
                loginErrorEl.style.display = 'none';
                loginNipEl.value = '';
                loginPasswordEl.value = '';
                loginOverlayEl.classList.add('open');
                loginNipEl.focus();
            }

            function closeLoginModal() {
                loginOverlayEl.classList.remove('open');
                pendingMessage = null;
            }

            loginCloseEl.addEventListener('click', closeLoginModal);

            loginFormEl.addEventListener('submit', function (event) {
                event.preventDefault();
                var nip = loginNipEl.value.trim();
                var password = loginPasswordEl.value;

                if (!nip || !password) return;

                loginSubmitEl.disabled = true;
                loginErrorEl.style.display = 'none';

                fetch(window.location.origin + '/api/widget/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Widget-Key': widgetKey },
                    body: JSON.stringify({ nip: nip, password: nip, widget_key: widgetKey, page_origin: pageOrigin }),
                })
                    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
                    .then(function (result) {
                        if (!result.ok) {
                            loginErrorEl.textContent = result.data.message || 'NIP atau password salah.';
                            loginErrorEl.style.display = 'block';
                            return;
                        }

                        saveSession(result.data.token, result.data.user);
                        var toRetry = pendingMessage;
                        closeLoginModal();
                        addMessage('bot', 'Login berhasil sebagai ' + (result.data.user.name || result.data.user.nip) + '.');

                        if (toRetry) {
                            sendMessage(toRetry, true);
                        }
                    })
                    .catch(function () {
                        loginErrorEl.textContent = 'Gagal terhubung ke server. Silakan coba lagi.';
                        loginErrorEl.style.display = 'block';
                    })
                    .finally(function () {
                        loginSubmitEl.disabled = false;
                    });
            });

            function addMessage(role, text) {
                var el = document.createElement('div');
                el.className = 'msg ' + role;
                if (role === 'bot') {
                    renderBotMessage(el, text);
                    addSpeechButton(el, text);
                } else {
                    el.textContent = text;
                }
                messagesEl.appendChild(el);
                messagesEl.scrollTop = messagesEl.scrollHeight;
                return el;
            }

            function addSpeechButton(element, text) {
                if (!text.trim()) return;

                function splitSpeechText(value) {
                    var sentences = value.trim().split(/(?<=[.!?。！？])\s+/u).filter(Boolean);
                    var chunks = [];
                    var currentChunk = '';

                    sentences.forEach(function (sentence) {
                        var remaining = sentence.trim();

                        while (remaining.length > 450) {
                            var splitAt = remaining.lastIndexOf(' ', 450);

                            if (splitAt < 1) splitAt = 450;

                            var part = remaining.slice(0, splitAt).trim();
                            remaining = remaining.slice(splitAt).trim();

                            if (currentChunk) {
                                chunks.push(currentChunk);
                                currentChunk = '';
                            }

                            if (part) chunks.push(part);
                        }

                        if (!remaining) return;

                        if (currentChunk && currentChunk.length + remaining.length + 1 > 450) {
                            chunks.push(currentChunk);
                            currentChunk = remaining;
                        } else {
                            currentChunk = currentChunk ? currentChunk + ' ' + remaining : remaining;
                        }
                    });

                    if (currentChunk) chunks.push(currentChunk);

                    return chunks;
                }

                var button = document.createElement('button');
                var error = document.createElement('span');
                var audio = null;
                var audioUrls = [];
                var abortController = null;
                var playbackId = 0;
                var isPlaying = false;
                button.type = 'button';
                button.className = 'speech-button';
                button.textContent = '🔊 Dengarkan';
                button.setAttribute('aria-label', 'Dengarkan jawaban');
                error.className = 'speech-error';

                button.addEventListener('click', async function () {
                    error.textContent = '';

                    if (isPlaying || button.disabled) {
                        playbackId += 1;
                        if (abortController) abortController.abort();
                        abortController = null;
                        audio.pause();
                        audio = null;
                        isPlaying = false;
                        button.textContent = '🔊 Dengarkan';
                        button.disabled = false;

                        return;
                    }

                    button.disabled = true;
                    var chunks = splitSpeechText(text);
                    var controller = new AbortController();
                    var currentPlaybackId = playbackId + 1;
                    playbackId = currentPlaybackId;
                    abortController = controller;

                    function loadChunk(index) {
                        if (audioUrls[index]) return Promise.resolve(audioUrls[index]);

                        return fetch(window.location.origin + '/api/widget/audio/speech', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Widget-Key': widgetKey,
                            },
                            body: JSON.stringify({
                                text: chunks[index],
                                widget_key: widgetKey,
                                page_origin: pageOrigin,
                            }),
                            signal: controller.signal,
                        }).then(async function (response) {
                            if (!response.ok) {
                                var result = await response.json();
                                throw new Error(result.message || 'Gagal membuat audio jawaban.');
                            }

                            var url = URL.createObjectURL(await response.blob());
                            audioUrls[index] = url;

                            return url;
                        });
                    }

                    function showError(requestError) {
                        if (controller.signal.aborted || currentPlaybackId !== playbackId) return;

                        error.textContent = requestError instanceof Error ? requestError.message : 'Audio jawaban tidak dapat diputar.';
                        isPlaying = false;
                        button.disabled = false;
                        button.textContent = '🔊 Dengarkan';
                        controller.abort();
                        audio = null;
                        abortController = null;
                    }

                    function playChunk(index, preparedUrl) {
                        if (controller.signal.aborted || currentPlaybackId !== playbackId) return Promise.resolve();

                        var urlPromise = preparedUrl ? Promise.resolve(preparedUrl) : loadChunk(index);

                        return urlPromise.then(function (url) {
                            if (controller.signal.aborted || currentPlaybackId !== playbackId) return;

                            audio = new Audio(url);
                            var currentAudio = audio;
                            var nextChunk = index + 1 < chunks.length
                                ? loadChunk(index + 1).then(function (url) {
                                    return { url: url };
                                }, function (requestError) {
                                    return { error: requestError };
                                })
                                : null;
                            currentAudio.addEventListener('ended', function () {
                                if (nextChunk) {
                                    nextChunk.then(function (result) {
                                        if ('error' in result) {
                                            showError(result.error);
                                            return;
                                        }

                                        return playChunk(index + 1, result.url);
                                    }).catch(showError);
                                } else if (currentPlaybackId === playbackId) {
                                    audio = null;
                                    abortController = null;
                                    isPlaying = false;
                                    button.textContent = '🔊 Dengarkan';
                                }
                            }, { once: true });
                            currentAudio.addEventListener('error', function () {
                                showError(new Error('Audio jawaban tidak dapat diputar.'));
                            }, { once: true });

                            return currentAudio.play().then(function () {
                                if (currentPlaybackId === playbackId) {
                                    isPlaying = true;
                                    button.disabled = false;
                                    button.textContent = '■ Hentikan';
                                }
                            });
                        });
                    }

                    try {
                        await playChunk(0);
                    } catch (requestError) {
                        showError(requestError);
                    }

                    if (!isPlaying && !controller.signal.aborted) {
                        button.disabled = false;
                    }
                });

                element.appendChild(button);
                element.appendChild(error);
            }

            function renderBotMessage(element, text) {
                var normalizedText = text
                    .replace(/<(https?:\/\/[^>\s]+)>/gi, '$1')
                    .replace(/\[[^\]]+\]\((https?:\/\/[^)\s]+)\)/gi, '$1');
                var urlPattern = /https?:\/\/[^\s<>"']+/gi;
                var lastIndex = 0;
                var match;

                while ((match = urlPattern.exec(normalizedText)) !== null) {
                    var rawUrl = match[0];
                    var url = rawUrl.replace(/[.,;!?]+$/, '');
                    var trailingText = rawUrl.slice(url.length);

                    if (!url) continue;

                    element.appendChild(document.createTextNode(normalizedText.slice(lastIndex, match.index)));

                    try {
                        var parsedUrl = new URL(url);
                        if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
                            element.appendChild(document.createTextNode(url));
                        } else {
                            var link = document.createElement('a');
                            link.href = parsedUrl.href;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            link.textContent = /\.pdf(?:$|[?#])/i.test(parsedUrl.href) ? 'Buka PDF ↗' : 'Buka tautan ↗';
                            element.appendChild(link);
                        }
                    } catch (e) {
                        element.appendChild(document.createTextNode(url));
                    }

                    if (trailingText) {
                        element.appendChild(document.createTextNode(trailingText));
                    }
                    lastIndex = match.index + rawUrl.length;
                }

                element.appendChild(document.createTextNode(normalizedText.slice(lastIndex)));
            }

            function showHandoverPopup(handover) {
                if (!handover || !/^https:\/\/wa\.me\//.test(handover.whatsapp_url || '')) return;

                var overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999';
                var box = document.createElement('div');
                box.style.cssText = 'background:#fff;border-radius:12px;padding:18px;max-width:320px;font-size:14px;color:#183746;box-shadow:0 10px 30px rgba(0,0,0,.2)';
                var title = document.createElement('strong');
                title.textContent = 'Hubungi Admin via WhatsApp';
                var text = document.createElement('p');
                text.textContent = handover.message || '';
                var link = document.createElement('a');
                link.href = handover.whatsapp_url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'Chat WhatsApp ' + (handover.whatsapp_number || '');
                link.style.cssText = 'display:block;text-align:center;background:#078589;color:#fff;padding:10px;border-radius:8px;text-decoration:none;font-weight:600;margin-bottom:8px';
                var close = document.createElement('button');
                close.type = 'button';
                close.textContent = 'Nanti saja';
                close.style.cssText = 'width:100%;padding:8px;border:1px solid #cbdfe1;background:#fff;border-radius:8px;cursor:pointer';
                function dismiss() { overlay.remove(); }
                link.addEventListener('click', dismiss);
                close.addEventListener('click', dismiss);
                box.appendChild(title);
                box.appendChild(text);
                box.appendChild(link);
                box.appendChild(close);
                overlay.appendChild(box);
                document.body.appendChild(overlay);
            }

            addMessage('bot', 'Halo! Ada yang bisa saya bantu terkait informasi kedinasan KKP?');
            renderAuthArea();

            function stopRecording() {
                if (recordingTimeout) {
                    clearTimeout(recordingTimeout);
                    recordingTimeout = null;
                }

                if (recorder && recorder.state === 'recording') {
                    recorder.stop();
                }
            }

            function transcribeRecording(blob) {
                var extension = blob.type.indexOf('mp4') !== -1 ? 'm4a' : blob.type.indexOf('ogg') !== -1 ? 'ogg' : 'webm';
                var formData = new FormData();
                var submitted = false;
                formData.append('audio', blob, 'recording.' + extension);
                formData.append('widget_key', widgetKey);
                formData.append('page_origin', pageOrigin || '');
                voiceStatusEl.textContent = 'Mengenali ucapan...';

                fetch(window.location.origin + '/api/widget/audio/transcribe', {
                    method: 'POST',
                    headers: { 'X-Widget-Key': widgetKey },
                    body: formData,
                })
                    .then(function (response) {
                        return response.json().then(function (data) {
                            if (!response.ok) throw new Error(data.message || 'Gagal mengenali ucapan.');
                            return data;
                        });
                    })
                    .then(function (data) {
                        var transcript = (data.text || '').trim();
                        if (!transcript) throw new Error('Ucapan tidak terdeteksi. Silakan coba lagi.');
                        voiceStatusEl.textContent = '';
                        submitted = true;
                        sendMessage(transcript, false);
                    })
                    .catch(function (error) {
                        voiceStatusEl.textContent = error instanceof Error ? error.message : 'Gagal mengenali ucapan.';
                    })
                    .finally(function () {
                        voiceBusy = false;
                        if (!submitted) {
                            micEl.disabled = false;
                            submitEl.disabled = false;
                        }
                    });
            }

            micEl.addEventListener('click', function () {
                if (recorder && recorder.state === 'recording') {
                    stopRecording();
                    return;
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
                    voiceStatusEl.textContent = 'Browser ini tidak mendukung perekaman suara. Gunakan Chrome, Edge, atau Safari terbaru.';
                    return;
                }

                voiceStatusEl.textContent = '';
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(function (stream) {
                        recordingStream = stream;
                        recordingChunks = [];
                        var mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
                            .find(function (type) { return MediaRecorder.isTypeSupported(type); });
                        recorder = new MediaRecorder(stream, mimeType ? { mimeType: mimeType } : undefined);
                        recorder.addEventListener('dataavailable', function (event) {
                            if (event.data.size > 0) recordingChunks.push(event.data);
                        });
                        recorder.addEventListener('stop', function () {
                            recordingStream.getTracks().forEach(function (track) { track.stop(); });
                            recordingStream = null;
                            recorder = null;
                            micEl.disabled = true;
                            micEl.classList.remove('recording');
                            micEl.innerHTML = microphoneIcon;
                            micEl.setAttribute('aria-label', 'Kirim pertanyaan dengan suara');
                            var blob = new Blob(recordingChunks, { type: recordingChunks[0] ? recordingChunks[0].type : 'audio/webm' });
                            if (blob.size === 0) {
                                voiceBusy = false;
                                micEl.disabled = false;
                                submitEl.disabled = false;
                                voiceStatusEl.textContent = 'Rekaman kosong. Silakan coba lagi.';
                                return;
                            }
                            transcribeRecording(blob);
                        });
                        recorder.start();
                        voiceBusy = true;
                        micEl.classList.add('recording');
                        micEl.innerHTML = stopIcon;
                        micEl.setAttribute('aria-label', 'Selesai merekam');
                        submitEl.disabled = true;
                        recordingTimeout = setTimeout(stopRecording, 60000);
                    })
                    .catch(function () {
                        voiceStatusEl.textContent = 'Mikrofon tidak dapat diakses. Periksa izin mikrofon pada browser Anda.';
                    });
            });

            formEl.addEventListener('submit', function (event) {
                event.preventDefault();
                if (voiceBusy) return;
                var message = inputEl.value.trim();
                if (!message) return;
                inputEl.value = '';
                sendMessage(message, false);
            });

            function sendMessage(message, skipEchoUserBubble) {
                if (!skipEchoUserBubble) {
                    addMessage('user', message);
                }

                submitEl.disabled = true;
                micEl.disabled = true;
                var loadingEl = addMessage('loading', 'Sedang mengetik...');

                var streamEl = null;

                fetch(window.location.origin + '/api/widget/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Widget-Key': widgetKey,
                    },
                    body: JSON.stringify({
                        message: message,
                        history: history.slice(-12),
                        widget_key: widgetKey,
                        identity_token: identityToken,
                        widget_session_token: sessionToken,
                        page_origin: pageOrigin,
                    }),
                })
                    .then(function (res) {
                        var reader = res.body.getReader();
                        var decoder = new TextDecoder();
                        var buffer = '';
                        var donePayload = null;

                        function pump() {
                            return reader.read().then(function (chunk) {
                                if (chunk.done) return donePayload;
                                buffer += decoder.decode(chunk.value, { stream: true });
                                var events = buffer.split('\n\n');
                                buffer = events.pop();
                                events.forEach(function (raw) {
                                    var ev = /^event: (.+)$/m.exec(raw);
                                    var dl = /^data: (.+)$/m.exec(raw);
                                    if (!ev || !dl) return;
                                    var payload = JSON.parse(dl[1]);
                                    if (ev[1] === 'delta') {
                                        if (!streamEl) {
                                            loadingEl.remove();
                                            streamEl = addMessage('bot', '');
                                        }
                                        streamEl.textContent += payload.text;
                                        messagesEl.scrollTop = messagesEl.scrollHeight;
                                    } else if (ev[1] === 'done') {
                                        donePayload = payload;
                                    }
                                });
                                return pump();
                            });
                        }

                        return pump();
                    })
                    .then(function (data) {
                        loadingEl.remove();
                        if (!data) throw new Error('empty');

                        if (data.require_widget_login) {
                            if (streamEl) streamEl.remove();
                            addMessage('bot', data.answer || 'Silakan login terlebih dahulu untuk melanjutkan.');
                            openLoginModal(message);
                            return;
                        }

                        var answer = data.answer || 'Maaf, terjadi kesalahan. Silakan coba lagi.';
                        var botEl = streamEl || addMessage('bot', answer);
                        botEl.replaceChildren();
                        renderBotMessage(botEl, answer);
                        addSpeechButton(botEl, answer);
                        if (typeof data.similarity === 'number') {
                            var sim = document.createElement('div');
                            sim.style.cssText = 'margin-top:6px;font-size:10px;opacity:.7';
                            sim.textContent = 'Tingkat kemiripan dengan sumber: ' + (data.similarity * 100).toFixed(1) + '%';
                            botEl.appendChild(sim);
                        }
                        showHandoverPopup(data.handover);
                        history.push({ role: 'user', content: message });
                        history.push({ role: 'assistant', content: answer });
                    })
                    .catch(function () {
                        loadingEl.remove();
                        addMessage('bot', 'Maaf, gagal terhubung ke server. Silakan coba lagi.');
                    })
                    .finally(function () {
                        submitEl.disabled = false;
                        micEl.disabled = false;
                        inputEl.focus();
                    });
            }
        })();
    </script>
</body>
</html>
