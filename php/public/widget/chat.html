<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asisten Chat</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #f8fafc;
    }
    header {
        background: #2563eb;
        color: white;
        padding: 14px 16px;
        font-weight: 600;
        font-size: 14px;
    }
    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .msg {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
    }
    .msg.user {
        align-self: flex-end;
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 4px;
    }
    .msg.bot {
        align-self: flex-start;
        background: white;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
    }
    .msg.loading {
        align-self: flex-start;
        color: #94a3b8;
        font-size: 12px;
        font-style: italic;
    }
    form {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #e2e8f0;
        background: white;
    }
    input {
        flex: 1;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 8px 14px;
        font-size: 13px;
        outline: none;
    }
    input:focus { border-color: #2563eb; }
    button[type="submit"] {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
    }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
    <header>Asisten AI KKP</header>
    <div id="messages"></div>
    <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Tulis pertanyaan..." autocomplete="off" />
        <button type="submit" id="chat-submit">Kirim</button>
    </form>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var widgetKey = params.get('widget_key');
            var identityToken = null;
            var pageOrigin = null;
            var history = [];

            var messagesEl = document.getElementById('messages');
            var formEl = document.getElementById('chat-form');
            var inputEl = document.getElementById('chat-input');
            var submitEl = document.getElementById('chat-submit');

            window.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'kkp-chat-init') {
                    pageOrigin = event.data.pageOrigin || null;
                    identityToken = event.data.identityToken || null;
                }
            });

            function addMessage(role, text) {
                var el = document.createElement('div');
                el.className = 'msg ' + role;
                el.textContent = text;
                messagesEl.appendChild(el);
                messagesEl.scrollTop = messagesEl.scrollHeight;
                return el;
            }

            addMessage('bot', 'Halo! Ada yang bisa saya bantu terkait informasi kedinasan KKP?');

            formEl.addEventListener('submit', function (event) {
                event.preventDefault();
                var message = inputEl.value.trim();
                if (!message) return;

                addMessage('user', message);
                inputEl.value = '';
                submitEl.disabled = true;

                var loadingEl = addMessage('loading', 'Sedang mengetik...');

                fetch(window.location.origin + '/api/widget/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Widget-Key': widgetKey,
                    },
                    body: JSON.stringify({
                        message: message,
                        history: history.slice(-12),
                        widget_key: widgetKey,
                        identity_token: identityToken,
                        page_origin: pageOrigin,
                    }),
                })
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        loadingEl.remove();
                        var answer = data.answer || 'Maaf, terjadi kesalahan. Silakan coba lagi.';
                        addMessage('bot', answer);
                        history.push({ role: 'user', content: message });
                        history.push({ role: 'assistant', content: answer });
                    })
                    .catch(function () {
                        loadingEl.remove();
                        addMessage('bot', 'Maaf, gagal terhubung ke server. Silakan coba lagi.');
                    })
                    .finally(function () {
                        submitEl.disabled = false;
                        inputEl.focus();
                    });
            });
        })();
    </script>
</body>
</html>
