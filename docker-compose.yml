# version: '3.8'


services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - csai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  db-pegawai:
    image: mysql:8.0
    command: --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0 --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${PEGAWAI_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PEGAWAI_DB_DATABASE:-siantar}
    volumes:
      - pegawaidata:/var/lib/mysql
      - ./m_peg.sql:/docker-entrypoint-initdb.d/m_peg.sql
    networks:
      - csai-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${PEGAWAI_DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - csai-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M

  laravel:
    build:
      context: ./php
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./php/.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      PYTHON_AI_URL: http://python-ai:8000
      PEGAWAI_DB_HOST: db-pegawai
      PEGAWAI_DB_PORT: 3306
      PEGAWAI_DB_DATABASE: ${PEGAWAI_DB_DATABASE:-siantar}
      PEGAWAI_DB_USERNAME: root
      PEGAWAI_DB_PASSWORD: ${PEGAWAI_DB_ROOT_PASSWORD}
    volumes:
      - ./php:/var/www/html
      - /var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ai:
        condition: service_started
      db-pegawai:
        condition: service_healthy
    networks:
      - csai-network
      - proxy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy-network
      - traefik.http.routers.csai.rule=Host(`csai.sdmao-kkp.online`) || Host(`ai.sdmao-kkp.online`) || Host(`csai.sdmao.id`)
      - traefik.http.routers.csai.entrypoints=websecure
      - traefik.http.routers.csai.tls=true
      - traefik.http.routers.csai.tls.certresolver=letsencrypt
      - traefik.http.routers.csai.middlewares=security-headers@file
      - traefik.http.services.csai.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 512M

  laravel-scheduler:
    build:
      context: ./php
      dockerfile: Dockerfile
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - ./php/.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      PYTHON_AI_URL: http://python-ai:8000
      PEGAWAI_DB_HOST: db-pegawai
      PEGAWAI_DB_PORT: 3306
      PEGAWAI_DB_DATABASE: ${PEGAWAI_DB_DATABASE:-siantar}
      PEGAWAI_DB_USERNAME: root
      PEGAWAI_DB_PASSWORD: ${PEGAWAI_DB_ROOT_PASSWORD}
    volumes:
      - ./php:/var/www/html
      - /var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ai:
        condition: service_started
      db-pegawai:
        condition: service_healthy
    networks:
      - csai-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M       

  python-ai:
    build:
      context: ./python
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./python/.env
    environment:
      DB_HOST: db
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      PYTORCH_NVML_BASED_CUDA_CHECK: "0"
    volumes:
      - ./python:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - csai-network
    command: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 300
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 1.5G

volumes:
  pgdata:
  redisdata:
  pegawaidata:

networks:
  csai-network:
    driver: bridge

  proxy-network:
    external: true
    name: proxy-network


  